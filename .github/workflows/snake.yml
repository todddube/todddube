name: Generate Snake Animation

# Builds the contribution-snake SVGs that README.md embeds, and publishes them
# to the `output` branch (raw.githubusercontent.com/todddube/todddube/output/).

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: todddube
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF6B6B&color_dots=%23FF6B6B,%23FFE66D,%23FF8E53,%23C8E6C9,%234ECDC4

      - name: Publish to output branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Update snake animations"
